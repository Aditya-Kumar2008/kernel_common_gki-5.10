name: Ruan Custom Kernel Grand Build
on:
  workflow_dispatch: # Manual Button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clean Cloud Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          df -h

      - name: 2. Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ruan-kernel-port # Tera wahi branch jisme MiniMax ne push kiya hai

      - name: 3. Install Toolchain (AOSP Clang 18)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz -C $GITHUB_WORKSPACE/clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 4. Start Compilation
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Use the defconfig MiniMax created
          make O=out vendor/ruan_user_defconfig
          
          # Heavy Lift (2-Core Power)
          make O=out -j$(nproc --all) \
               CC=clang \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip

      - name: 5. Prepare AnyKernel3 ZIP
        run: |
          # Kernel Image uthao
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Agar modules compile hue hain toh unhe bhi copy karo (GKI standard)
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/backup/ \;
          
          cd AnyKernel3
          zip -r9 ../Ruan-Kernel-Flashable.zip * -x .git README.md

      - name: 6. Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Poco-Pad-5G-Kernel
          path: Ruan-Kernel-Flashable.zip
